<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

*{box-sizing:border-box;}

body{
margin:0;
font-family:'Poppins',sans-serif;

background-image:
url("YOUR URL HERE");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

min-height:100vh;
}

.container{
max-width:540px;
margin:auto;
padding:20px;
}

.header{
text-align:center;
color:white;
margin-bottom:10px;
}

/* ===== METRIC CARDS (MATCH FORM CARDS) ===== */

.metrics{
display:flex;
gap:14px;
margin:15px 0 15px 0;
justify-content:center;
flex-wrap:wrap;
}

.metric{
background:rgba(255,255,255,0.96);   
padding:20px;
border-radius:16px;
text-align:center;

min-width:150px;
flex:1;
max-width:160px;

border-top:4px solid #007a3d;

box-shadow:0 8px 30px rgba(0,0,0,0.15);

transition:transform .2s ease, box-shadow .2s ease;
}

.metric:hover{
transform:translateY(-3px);
box-shadow:0 12px 30px rgba(0,0,0,0.18);
}

.metric span{
font-size:26px;
font-weight:600;
color:#007a3d;
display:block;
letter-spacing:.3px;
}

.metric small{
font-size:14px;
color:#444;
font-weight:500;
}

.title{
font-size:28px;
font-weight:600;
}

.card{
background:rgba(255,255,255,0.96);
padding:20px;
border-radius:16px;
margin-top:15px;
box-shadow:0 8px 30px rgba(0,0,0,0.15);
}

label{
display:flex;
align-items:center;
gap:8px;
margin-top:15px;
font-weight:500;
color:#222;
}

input,textarea,select{
width:100%;
padding:12px;
margin-top:6px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

.shift{
display:flex;
gap:8px;
}

.shift button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#eee;
font-weight:500;
}

.shift button.active{
background:#1565C0;
color:white;
}

.type{
padding:14px;
background:#eee;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

.type.active{
background:#2E7D32;
color:white;
}

.save{
flex:1;
height:48px;
border:none;
border-radius:12px;
background:#00C853;
color:white;
font-size:16px;
font-weight:600;
}

.msg{
margin-top:12px;
font-weight:600;
opacity:0;
transition:opacity 0.4s ease;
}

.msg.show{
opacity:1;
}

.hidden{display:none;}

/* ===== WIZARD PROGRESS ===== */

.wizard-progress{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10px;
margin-bottom:10px;
position:relative;
}

.wizard-progress{
background:rgba(255,255,255,0.96);
box-shadow:0 8px 30px rgba(0,0,0,0.15);
}

.progress-line{
position:absolute;
top:28px;
left:12%;
width:76%;
height:4px;
background:#d0d7de;
border-radius:3px;
z-index:0;
}

.wizard-step{
flex:1;
text-align:center;
opacity:0.5;
transition:all .3s ease;
position:relative;
z-index:1;
}

.wizard-step .dot{
width:18px;
height:18px;
border-radius:50%;
background:#bbb;
margin:auto;
margin-bottom:8px;
transition:all .3s ease;
}

.wizard-step .label{
font-size:15px;
font-weight:600;
margin-top:6px;
}

.wizard-step.active{
opacity:1;
}

.wizard-step.active .dot{
width:26px;
height:26px;
background:#007a3d;
box-shadow:0 0 0 4px rgba(0,122,61,0.2);
}

.wizard-step.active .label{
font-weight:600;
color:#007a3d;
}

.step{display:none;}
.step.active{display:block;}

.wizard-nav{
display:flex;
justify-content:space-between;
margin-top:20px;
gap:10px;
}

.wizard-btn{
flex:1;
height:48px;
border:none;
border-radius:12px;
background:#777;
color:white;
font-weight:600;
font-size:16px;
}

.wizard-btn.secondary{
background:#777;
}

.progress{
display:flex;
justify-content:center;
gap:10px;
margin:15px 0;
}

.progress span{
width:12px;
height:12px;
border-radius:50%;
background:#ccc;
}

.progress span.active{
background:#007a3d;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<div class="title">Digital Safety</div>
</div>

<div class="card wizard-progress">

<div class="progress-line"></div>

<div class="wizard-step active" id="stepDot1">
<div class="dot"></div>
<div class="label">Incident Details</div>
</div>

<div class="wizard-step" id="stepDot2">
<div class="dot"></div>
<div class="label">Observation</div>
</div>

<div class="wizard-step" id="stepDot3">
<div class="dot"></div>
<div class="label">Action Plan</div>
</div>

</div>

<div class="metrics">

  <div class="metric">
    <span id="injuryFree">--</span>
    <small>Injury Free Days</small>
  </div>

  <div class="metric">
    <span id="ltiValue">--</span>
    <small>Lost Time Injury</small>
  </div>

  <div class="metric">
    <span id="ltiIncident">--</span>
    <small>Lost Time Incident</small>
  </div>

</div>

<div id="step1" class="step active">
<div class="card">

<label>Audit Date</label>
<input type="date" id="auditDate">

<label>Incident Code (Worker Alert Code)</label>
<input id="incidentCodeField" placeholder="Optional">

<label>Plant</label>
<select id="plant">
<option value="">--select--</option>
</select>

<label>Department</label>

<select id="department">
<option value="">--select--</option>
<option>OPTION_1</option>
<option>OPTION_2</option>
<option>OPTION_3</option>
</select>

<label>Line</label>

<input list="lineList" id="line" placeholder="Search or select line">

<datalist id="lineList"></datalist>


<label>Location/Area</label>

<input id="area">


<label>Shift</label>

<div class="shift">

<button onclick="setShift(this)">1st Shift</button>
<button onclick="setShift(this)">2nd Shift</button>
<button onclick="setShift(this)">3rd Shift</button>

</div>


<label>Auditor Name</label>
<input id="auditor">


<label>Zone Leader</label>
<input id="supervisor">

<label>Reporter Name</label>
<input id="reporter">

<label>Reporter Type</label>
<select id="reporterType">
<option value="">--select--</option>
<option>Operator</option>
<option>Staff</option>
</select>

</div>


<div class="wizard-nav">
<button class="wizard-btn" onclick="nextStep()">Next</button>
</div>
</div>


<div id="step2" class="step">
<div class="card">
<label>Observation Type</label>

<div class="type" onclick="setType(this)">Unsafe Act</div>
<div class="type" onclick="setType(this)">Unsafe Condition</div>
<div class="type" onclick="setType(this)">Near Miss</div>
<div class="type" onclick="setType(this)">First Aid</div>


<div id="firstAidDiv" class="hidden">

<label>Injury Type</label>
<input id="injuryType">

<label>Injury Point</label>
<input id="injuryPoint">

<label>Employee Name</label>
<input id="empName">

<label>Employee Contractor</label>
<input id="empContract">

<label>Root Cause</label>
<input id="rootCause">

<label>Action Taken</label>
<input id="actionTaken">

</div>


<label>NC Observation Remark</label>

<textarea id="remark"></textarea>


<label>Image</label>

<input type="file" id="image" accept="image/*" capture="environment">

<img id="preview">

</div>


<div class="wizard-nav">
<button class="wizard-btn secondary" onclick="prevStep()">Back</button>
<button class="wizard-btn" onclick="nextStep()">Next</button>
</div>
</div>


<div id="step3" class="step">
<div class="card">
<label>Responsibility</label>
<input id="responsibility">


<label>Action Plan</label>
<textarea id="actionPlan"></textarea>


<label>Target Date</label>
<input type="date" id="targetDate">


<label>Status</label>
<input id="status" value="Open">

<label>Scope for Kaizen</label>
<input id="kaizen" placeholder="--NA--">

<div class="wizard-nav">
<button class="wizard-btn secondary" onclick="prevStep()">Back</button>
<button class="save" onclick="save()">Submit Observation</button>
</div>

<div id="msg" class="msg"></div>

</div>

</div>


<script>

let selectedShift="";
let selectedType="";
let isSaving=false;


let currentStep = 1;

function showStep(n)
{

document.querySelectorAll(".step")
.forEach(s=>s.classList.remove("active"));

document.getElementById("step"+n)
.classList.add("active");

/* update wizard progress */

document.querySelectorAll(".wizard-step")
.forEach(s=>s.classList.remove("active"));

document.getElementById("stepDot"+n)
.classList.add("active");

window.scrollTo({top:0,behavior:"smooth"});

}

function nextStep(){
if(currentStep<3){
currentStep++;
showStep(currentStep);
}
}

function prevStep(){
if(currentStep>1){
currentStep--;
showStep(currentStep);
}
}


const INCIDENT_FROM_URL = "<?= incident ?>";


function setShift(btn){

document.querySelectorAll(".shift button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

selectedShift=btn.innerText;

}


function setType(el){

document.querySelectorAll(".type")
.forEach(e=>e.classList.remove("active"));

el.classList.add("active");

selectedType=el.innerText;

firstAidDiv.classList.add("hidden");

if(selectedType=="First Aid")
firstAidDiv.classList.remove("hidden");

}



image.onchange=function(){

const reader=new FileReader();

reader.onload=function(){
preview.src=reader.result;
};

reader.readAsDataURL(image.files[0]);

};



let fadeTimer=null;


function showMessage(text,color="green")
{
msg.innerText=text;
msg.style.color=color;

msg.classList.add("show");

clearTimeout(fadeTimer);

fadeTimer=setTimeout(()=>{
msg.classList.remove("show");
},8000);
}



function save()
{
if(isSaving) return;


if(!plant.value)
{
showMessage("Select Plant","red");
return;
}

if(!line.value)
{
showMessage("Select Line","red");
return;
}

if(!selectedShift)
{
showMessage("Select Shift","red");
return;
}

if(!selectedType)
{
showMessage("Select Observation Type","red");
return;
}


isSaving=true;


const btn=document.querySelector(".save");

btn.disabled=true;

btn.innerHTML="Submitting<span style='margin-left:6px;'>⏳</span>";


const file=image.files[0];


if(file)
{
const reader=new FileReader();

reader.onload=function()
{
submit(reader.result.split(",")[1]);
};

reader.readAsDataURL(file);
}
else
{
submit("");
}

}

function formatIndianDate(dateStr){

if(!dateStr) return "";

const parts = dateStr.split("-");

return parts[2] + "/" + parts[1] + "/" + parts[0];

}

function submit(base64)
{

const kaizenValue =
kaizen.value.trim()=="" ? "--NA--" : kaizen.value;

const form={

auditDate: formatIndianDate(auditDate.value),
incidentCode: incidentCodeField.value.trim(),
plant:plant.value,
department: department.value,
line:line.value,
area:area.value,
shift:selectedShift,

auditor:auditor.value,
supervisor:supervisor.value,
reporter:reporter.value,
reporterType:reporterType.value,

type:selectedType,

injuryType: injuryType.value,
injuryPoint:injuryPoint.value,
empName:empName.value,
empContract:empContract.value,

rootCause:rootCause.value,
actionTaken:actionTaken.value,

remark:remark.value,

image:base64,

responsibility:responsibility.value,
actionPlan:actionPlan.value,
targetDate:formatIndianDate(targetDate.value),
status: document.getElementById("status").value || "Open",
kaizen: kaizenValue

};


google.script.run

.withSuccessHandler(function(code)
{
showMessage("Incident: "+code "Submitted Successfully","green");

resetForm();

setTimeout(()=>{
isSaving=false;
const btn=document.querySelector(".save");
btn.disabled=false;
btn.innerText="Submit Observation";
},500);

})

.withFailureHandler(function(err)
{

showMessage("Submission Failed: "+err.message,"red");

setTimeout(()=>{
isSaving=false;
const btn=document.querySelector(".save");
btn.disabled=false;
btn.innerText="Submit Observation";
},500);

})

.saveEntry(form);

}


function resetForm()
{

plant.value="";

line.value="";

area.value="";

auditor.value="";

supervisor.value="";

reporter.value="";

reporterType.value="";

incidentCodeField.value="";

remark.value="";

responsibility.value="";

actionPlan.value="";

targetDate.value="";

status.value="Open";

image.value="";

preview.src="";

selectedShift="";

selectedType="";


document.querySelectorAll(".shift button")
.forEach(b=>b.classList.remove("active"));


document.querySelectorAll(".type")
.forEach(b=>b.classList.remove("active"));


firstAidDiv.classList.add("hidden");

}

const today = new Date().toISOString().split("T")[0];
auditDate.value = today;
auditDate.max = today;   

if(INCIDENT_FROM_URL){
  document.getElementById("incidentCodeField").value = INCIDENT_FROM_URL;
}

if(INCIDENT_FROM_URL)
{
  google.script.run
  .withSuccessHandler(function(d){

    if(!d) return;

    plant.value = d.plant;
    line.value = d.line;

    document.querySelectorAll(".type").forEach(el=>{
      if(el.innerText === d.type){
        setType(el);
      }
    });

  })
  .getAlertDetails(INCIDENT_FROM_URL);
}


google.script.run
.withSuccessHandler(data=>{

data.plants.forEach(p=>
plant.innerHTML+=`<option>${p}</option>`
);

data.lines.forEach(l=>{

const opt=document.createElement("option");

opt.value=l;

lineList.appendChild(opt);

});

})
.getMaster();

/* LOAD SAFETY METRICS */

google.script.run.withSuccessHandler(m=>{

injuryFree.innerText = m.injuryFreeDays;
ltiValue.innerText = m.lti + "%";
ltiIncident.innerText = m.ltiIncident + "%";

}).getSafetyMetrics();

</script>

</body>
</html>
